name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: lead-lag-arb-x86_64
          - target: x86_64-unknown-linux-musl
            artifact: lead-lag-arb-x86_64-musl

    steps:
      - uses: actions/checkout@v4

      - name: Install musl-gcc (for musl target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable

      - name: Add cross toolchain
        if: matrix.target != format('{0}-{1}', runner.os, 'Linux')
        run: |
          rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/live-trader dist/
          cp .env.example dist/
          cp -r config dist/ 2>/dev/null || true

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
