[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/symbol-selector",
    "crates/exchange-adapter-lbank",
    "crates/exchange-adapter-binance",
    "crates/md-gateway",
    "crates/clock-sync",
    "crates/orderbook",
    "crates/signal-engine",
    "crates/risk-gate",
    "crates/execution",
    "crates/fee-pnl",
    "crates/persistence",
    "crates/metrics",
    "apps/live-trader",
    "test",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Lead-Lag Team"]
license = "MIT"
rust-version = "1.86"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.13"

# Decimal for financial calculations
rust_decimal = { version = "1.34", features = ["serde", "serde-with-str"] }
rust_decimal_macros = "1.34"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli", "deflate"], default-features = false }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Config
toml = "0.8"
dotenvy = "0.15"

# Utilities
futures = "0.3"
parking_lot = "0.12"
dashmap = "5.5"
indexmap = "2.2"
ordered-float = { version = "2.10", features = ["serde"] }

# Metrics
prometheus = "0.13"
metrics = "0.21"

# Backoff for reconnection
backoff = { version = "0.4", features = ["tokio"] }

# Crypto for signing
ring = "0.17"
base64 = "0.22"

# UUID for request tracking
uuid = { version = "1.7", features = ["v4", "serde"] }

# Note: Binance SDK removed - using direct WebSocket connections via tokio-tungstenite
# This avoids OpenSSL dependency issues and provides more control over connection handling

[profile.dev]
opt-level = 0
debug = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
